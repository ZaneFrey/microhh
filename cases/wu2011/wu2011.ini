[master]
npx=1
npy=1

[grid]
itot=576
jtot=48
ktot=64

xsize=8.640
ysize=0.720
zsize=0.460

utrans=0
vtrans=0.

swspatialorder=2

[advec]
cflmax=0.3

[diff]
swdiff=smag2
cs=0.17
dnmax=0.3

[thermo]
swthermo=0

[force]
swlspres=dpdx
# Constant pressure gradient from the reported neutral stress balance:
# dpdx = -u_*^2 / H = -(0.102 m s-1)^2 / 0.460 m.
dpdx=-2.2617391304347827e-2

[boundary]
mbcbot=noslip
mbctop=freeslip
sbcbot=flux
sbctop=neumann
swboundary=surface
z0m=0.00003
z0h=0.00003

[fields]
visc=1.e-5
svisc=1.e-5

rndseed=2
rndamp[u]=0.1
rndamp[v]=0.1
rndz=0.46
rndexp=2.

[buffer]
swbuffer=0

[time]
endtime=600
savetime=60
outputiter=1
adaptivestep=true
starttime=0
rkorder=3

[stats]
swstats=1
sampletime=10

[windfarm]
# Use "adm" for the non-rotating actuator-disk validation.  The default
# "admr" adds the rotational (tangential) force using the same axial load.
swwf=admr
diameter=0.15
hubheight=0.125
diskmemtime=0.
# Match the 0.015 m horizontal grid spacing of the ADM-R1 reference case.
adresolution=0.0075
wfturblocs=wind_turbine_locations.txt
wfturblocformat=xy
wfyawfile=wind_turbine_yaw.txt
wfstarttime=0.
wframptime=0.
sampletime=0.
ctprime=1.33333333333
cpprime=0.8
tsr=4.
rotationsign=1

[dump]
swdump=1
sampletime=10
dumplist=u,v,w

[cross]
swcross=1
sampletime=10
crosslist=u,v,w
xy=0.125
yz=0.9
