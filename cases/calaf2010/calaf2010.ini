# Dimensional MicroHH realization of baseline case A1 in Calaf et al. (2010).
# The paper normalizes lengths by H=1000 m and velocities by u_*=0.45 m s-1.
# Its reference geometry has Lx=Ly=pi H, D=zh=0.1 H, 4 x 6 turbines,
# z0/H=1e-4, and C_T'=4/3. MicroHH uses its own finite-difference and
# Gaussian actuator-disk discretizations, so this is not a bitwise reproduction
# of the original KULeuven LES.

[master]
npx=1
npy=1

[grid]
itot=128
jtot=128
ktot=128

xsize=3141.592653589793
ysize=3141.592653589793
zsize=1000.

utrans=0.
vtrans=0.

swspatialorder=2

[advec]
cflmax=0.3

[diff]
swdiff=smag2
# Constant Smagorinsky coefficient used by the KULeuven A1 simulation.
cs=0.14
dnmax=0.3

[thermo]
swthermo=0

[force]
swlspres=geo
# Coriolis parameter at 40 degrees latitude from the paper's Appendix (A3).
fc=9.34e-5
# Constant u_geo and v_geo profiles are written to calaf2010_input.nc.
# The former pressure-gradient forcing was:
# swlspres=dpdx
# dpdx=-2.025e-4


[boundary]
mbcbot=noslip
mbctop=freeslip
swboundary=surface
z0m=0.1
z0h=0.1

[fields]
visc=1.e-5

rndseed=2
rndamp[u]=0.1
rndamp[v]=0.1
rndz=1000.
rndexp=2.

[buffer]
swbuffer=0

[time]
# One nondimensional time unit H/u_* is 2222.222 s. The paper uses 60 units
# for startup followed by 60 units for A1 statistics (120 units total).
# Discard t < 133333.333 s as spinup when post-processing this cold start.
#endtime=266666.6666666667
endtime=86400
savetime=7200.
outputiter=50
adaptivestep=true
starttime=0.
iotimeprec=-2
rkorder=4

[stats]
swstats=1
sampletime=60.

[windfarm]
# Dynamic yaw is available for both adm and admr. Keep adm here to retain the
# non-rotating actuator-disk model used by Calaf et al.
swwf=adm
swdynamicyaw=true
diameter=100.
hubheight=100.
diskmemtime=600
adresolution=5.
wfturblocs=turbine_locations.txt
wfturblocformat=xy
wfyawfile=turbine_yaw.txt
wfstarttime=0.
wframptime=600.
sampletime=10.
ctprime=1.3333333333333333
# First-order filtering time for the upstream yaw-sensor disk.
yawmemtime=60.
# Controller interval, upstream sensor distance in rotor diameters, maximum
# physical yaw rate, and controller deadband.
yawupdatetime=60.
yawsensordist=1.
yawrate=0.5
yawdeadband=2.

[dump]
swdump=1
sampletime=600.
dumplist=u,v,w

[cross]
swcross=1
sampletime=60.
crosslist=u,v,w
xy=100.
xz=261.799
yz=392.699
