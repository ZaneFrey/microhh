[master]
npx=1
npy=1

[grid]
itot=512
jtot=512
ktot=350

xsize=12800.
ysize=12800.
zsize=4000.

utrans=0.
vtrans= 0.

swspatialorder=2

[advec]
swadvec=2i62
cflmax=0.5
fluxlimit_list=thl,qt

[diff]
swdiff=amd2
dnmax=0.3
camd_x=0.3333333333333333
camd_y=0.3333333333333333
camd_z=0.3333333333333333
